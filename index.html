<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Reflect - Text Yourself</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <!-- PWA Manifest & Theme -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#00bf57">

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .then(reg => console.log('SW registered!', reg))
          .catch(err => console.error('SW failed:', err));
      });
    }
  </script>

  <style>
    * {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, textarea {
      user-select: text;
    }

    /* Screen height fixing for mobile viewports */
    .app-viewport {
      height: 100vh;
      height: 100dvh;
    }

    /* Safe area padding for iPhones with home bars */
    .pb-safe {
      padding-bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px));
    }
    .pt-safe {
      padding-top: calc(0.5rem + env(safe-area-inset-top, 0px));
    }

    /* Hide standard scrollbars for a native app feel */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Smooth switch toggle transition */
    .toggle-knob {
      transition: transform 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Responsive bubble styling */
    .bubble-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
      max-width: 88%;
      min-width: 220px;
    }

    @media (min-width: 640px) {
      .bubble-wrapper {
        max-width: 78%;
        min-width: 260px;
      }
    }

    .bubble-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .bubble-content {
      position: relative;
      z-index: 2;
      width: 100%;
      text-align: center;
      word-break: break-word;
      overflow-wrap: break-word;
      font-size: 1.05rem;
      line-height: 1.45;
      color: #000000;
      font-weight: 500;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased overflow-hidden flex justify-center selection:bg-teal-200">

  <!-- Mobile Max Width Shell -->
  <div id="appShell" class="w-full max-w-md bg-white app-viewport flex flex-col relative overflow-hidden shadow-2xl">

    <!-- ========================================== -->
    <!-- VIEW 1: HOME PAGE (Conversations List)    -->
    <!-- ========================================== -->
    <section id="viewHome" class="flex-1 flex flex-col h-full bg-[#f8fafc]">
      
      <!-- Top App Bar -->
      <header class="px-5 pt-safe pt-4 pb-3 bg-white border-b border-slate-100 flex items-center justify-between shadow-xs">
        <div class="flex items-center space-x-3">
          <div class="w-9 h-9 rounded-2xl bg-gradient-to-tr from-[#00bf57] to-[#009abb] flex items-center justify-center text-white shadow-sm shadow-emerald-500/20">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
            </svg>
          </div>
          <div>
            <h1 class="text-lg font-bold tracking-tight text-slate-900 leading-none">Reflect</h1>
            <p class="text-[11px] font-medium text-slate-400 mt-1">Dual-voice self talk</p>
          </div>
        </div>
      </header>

      <!-- Search Filter Bar -->
      <div class="px-4 py-3 bg-white border-b border-slate-100">
        <div class="relative flex items-center">
          <svg class="w-4 h-4 text-slate-400 absolute left-3.5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <input 
            id="searchInput" 
            type="text" 
            placeholder="Search past reflections..." 
            class="w-full pl-9 pr-4 py-2 bg-slate-100/80 rounded-xl text-[14px] text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#009abb]/30 focus:bg-white transition-all border border-transparent focus:border-slate-200"
          />
        </div>
      </div>

      <!-- Chats List (Scrollable Area) -->
      <main id="chatListContainer" class="flex-1 overflow-y-auto px-4 py-3 space-y-2.5 no-scrollbar">
        <!-- Injected dynamically via JS -->
      </main>

      <!-- Bottom Floating New Chat Button -->
      <div class="p-4 bg-gradient-to-t from-white via-white/95 to-transparent pb-safe border-t border-slate-100">
        <button 
          id="btnNewReflection"
          class="w-full py-3.5 px-5 bg-slate-900 hover:bg-slate-800 active:scale-[0.98] text-white rounded-2xl font-semibold text-sm flex items-center justify-center space-x-2 shadow-lg shadow-slate-900/10 transition-transform"
        >
          <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
          </svg>
          <span>New Reflection</span>
        </button>
      </div>
    </section>

    <!-- ========================================== -->
    <!-- VIEW 2: ACTIVE CHAT SCREEN                 -->
    <!-- ========================================== -->
    <section id="viewChat" class="hidden flex-1 flex-col h-full bg-white relative">
      
      <!-- Chat Header -->
      <header class="px-3 pt-safe pt-3 pb-2.5 bg-white/90 backdrop-blur border-b border-slate-100 flex items-center justify-between z-20">
        <button 
          id="btnBackToHome" 
          aria-label="Back" 
          class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-slate-100 active:bg-slate-200 text-slate-700 transition"
        >
          <svg class="w-6 h-6 stroke-[2.2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
          </svg>
        </button>

        <div id="chatHeaderTitle" class="flex-1 text-center px-2 cursor-pointer">
          <h2 id="activeChatTitle" class="font-bold text-slate-900 text-base leading-tight truncate">Chat Name</h2>
          <span class="text-[11px] text-slate-400 font-medium">Tap to rename</span>
        </div>

        <!-- Chat Options Menu Button -->
        <button 
          id="btnChatMenu" 
          aria-label="Options" 
          class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-slate-100 active:bg-slate-200 text-slate-700 transition"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"/>
          </svg>
        </button>
      </header>

      <!-- Messages Stream -->
      <main id="messagesContainer" class="flex-1 overflow-y-auto px-4 py-4 space-y-4 no-scrollbar">
        <!-- Rendered messages -->
      </main>

      <!-- Input Bar & Mode Toggle -->
      <footer class="p-3 bg-white border-t border-slate-100 pb-safe">
        
        <!-- Perspective Switch Toggle -->
        <div class="flex items-center justify-between mb-2 px-1">
          <div class="flex items-center space-x-2">
            <button 
              id="modeToggleSwitch" 
              type="button" 
              role="switch" 
              aria-checked="false" 
              class="w-13 h-7 w-[52px] bg-[#00bf57] rounded-full p-0.5 flex items-center cursor-pointer transition-colors duration-200 relative focus:outline-none"
            >
              <div id="toggleKnob" class="toggle-knob w-6 h-6 bg-white rounded-full shadow-md"></div>
            </button>
            <span id="modeStatusLabel" class="text-xs font-semibold text-emerald-700 uppercase tracking-wide">
              Green Mode
            </span>
          </div>

          <span id="perspectiveHint" class="text-[11px] text-slate-400">
            Left / Voice 1
          </span>
        </div>

        <!-- Pill Input Form -->
        <form id="chatForm" class="relative flex items-center">
          <input 
            type="text" 
            id="messageInput" 
            autocomplete="off" 
            placeholder="Type here..." 
            class="w-full py-3.5 pl-5 pr-12 bg-[#cbd5e1]/50 focus:bg-slate-200/80 rounded-full text-[16px] text-slate-900 placeholder-slate-500 focus:outline-none transition-all"
          />
          <button 
            type="submit" 
            id="sendBtn" 
            aria-label="Send" 
            class="absolute right-1.5 w-9 h-9 rounded-full bg-slate-900 text-white flex items-center justify-center active:scale-95 transition-transform disabled:opacity-40"
          >
            <svg class="w-4 h-4 ml-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
            </svg>
          </button>
        </form>
      </footer>
    </section>

    <!-- ========================================== -->
    <!-- MODALS & ACTION SHEETS                     -->
    <!-- ========================================== -->
    
    <!-- 3-Dots Action Sheet Modal -->
    <div id="actionSheetModal" class="hidden fixed inset-0 z-50 bg-black/40 backdrop-blur-xs flex items-end justify-center transition-opacity">
      <div class="w-full max-w-md bg-white rounded-t-3xl p-5 pb-safe space-y-3 animate-in fade-in slide-in-from-bottom duration-200">
        <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-2"></div>
        <h3 id="modalChatTitle" class="text-sm font-bold text-slate-400 uppercase tracking-wider text-center truncate">Options</h3>
        
        <div class="space-y-1">
          <button id="modalBtnRename" class="w-full py-3 px-4 rounded-xl flex items-center space-x-3 text-slate-700 hover:bg-slate-100 text-left font-medium active:bg-slate-200">
            <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
            <span>Rename Reflection</span>
          </button>
          <button id="modalBtnExport" class="w-full py-3 px-4 rounded-xl flex items-center space-x-3 text-slate-700 hover:bg-slate-100 text-left font-medium active:bg-slate-200">
            <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
            <span>Copy as Markdown</span>
          </button>
          <button id="modalBtnDelete" class="w-full py-3 px-4 rounded-xl flex items-center space-x-3 text-rose-600 hover:bg-rose-50 text-left font-medium active:bg-rose-100">
            <svg class="w-5 h-5 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            <span>Delete Reflection</span>
          </button>
        </div>

        <button id="modalBtnCancel" class="w-full py-3 bg-slate-100 hover:bg-slate-200 text-slate-800 rounded-xl font-medium mt-2">
          Cancel
        </button>
      </div>
    </div>

  </div>

  <script>
    // App State Management
    const STORAGE_KEY = 'reflect_app_data_v2';
    let appData = {
      chats: [],
      activeChatId: null,
      currentMode: 'green' // 'green' (left) or 'blue' (right)
    };

    let targetActionChatId = null;

    // Load initial data
    function loadData() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          appData = JSON.parse(saved);
        } catch (e) {
          console.error(e);
        }
      }

      // Default sample if empty
      if (!appData.chats || appData.chats.length === 0) {
        const sampleId = 'chat_' + Date.now();
        appData.chats = [
          {
            id: sampleId,
            title: 'Chat Name',
            updatedAt: Date.now(),
            messages: [
              { id: '1', side: 'green', text: 'one mode for green', timestamp: Date.now() - 300000 },
              { id: '2', side: 'blue', text: 'one mode for blue', timestamp: Date.now() - 100000 }
            ]
          }
        ];
        saveData();
      }
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
    }

    function getRelativeTime(timestamp) {
      const diff = Math.floor((Date.now() - timestamp) / 1000);
      if (diff < 60) return 'Just now';
      if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
      if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
      return `${Math.floor(diff / 86400)}d ago`;
    }

    // View Switching
    const viewHome = document.getElementById('viewHome');
    const viewChat = document.getElementById('viewChat');

    function switchView(viewName) {
      if (viewName === 'chat') {
        viewHome.classList.add('hidden');
        viewChat.classList.remove('hidden');
        viewChat.classList.add('flex');
        renderChatMessages();
      } else {
        viewChat.classList.add('hidden');
        viewChat.classList.remove('flex');
        viewHome.classList.remove('hidden');
        renderHomeList();
      }
    }

    // Render Home List
    function renderHomeList(filterQuery = '') {
      const container = document.getElementById('chatListContainer');
      container.innerHTML = '';

      const query = filterQuery.toLowerCase().trim();
      const filtered = appData.chats
        .filter(c => {
          if (!query) return true;
          return c.title.toLowerCase().includes(query) || 
                 c.messages.some(m => m.text.toLowerCase().includes(query));
        })
        .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="h-64 flex flex-col items-center justify-center text-slate-400 text-center px-4">
            <svg class="w-12 h-12 stroke-1 mb-2 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
            <p class="text-sm">No reflections found</p>
          </div>
        `;
        return;
      }

      filtered.forEach(chat => {
        const lastMsg = chat.messages[chat.messages.length - 1];
        const lastText = lastMsg ? lastMsg.text : 'Empty reflection...';
        const badgeColor = lastMsg?.side === 'blue' ? 'bg-[#009abb]' : 'bg-[#00bf57]';

        const item = document.createElement('div');
        item.className = 'w-full bg-white rounded-2xl p-4 border border-slate-200/70 shadow-xs flex items-center justify-between active:bg-slate-50 transition cursor-pointer';
        item.onclick = (e) => {
          if (e.target.closest('.menu-btn')) return;
          openChat(chat.id);
        };

        item.innerHTML = `
          <div class="flex-1 min-w-0 pr-3">
            <div class="flex items-center justify-between mb-1">
              <h3 class="font-bold text-slate-900 text-[15px] truncate">${chat.title || 'Untitled'}</h3>
              <span class="text-[11px] text-slate-400 font-medium ml-2 shrink-0">${getRelativeTime(chat.updatedAt)}</span>
            </div>
            <div class="flex items-center space-x-1.5">
              <span class="w-2 h-2 rounded-full ${badgeColor} shrink-0"></span>
              <p class="text-xs text-slate-500 truncate">${escapeHTML(lastText)}</p>
            </div>
          </div>
          <button class="menu-btn w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-slate-700 active:bg-slate-100 shrink-0">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"/></svg>
          </button>
        `;

        item.querySelector('.menu-btn').onclick = (e) => {
          e.stopPropagation();
          openActionSheet(chat.id);
        };

        container.appendChild(item);
      });
    }

    function openChat(chatId) {
      appData.activeChatId = chatId;
      saveData();
      switchView('chat');
    }

    // SVG Bubble Generator
    function createBubbleSVG(side, width, height) {
      const radius = Math.min(height / 2, 28);
      const finW = 16;
      let path = '';
      const color = side === 'green' ? '#00bf57' : '#009abb';

      if (side === 'green') {
        path = `
          M 0 0
          C ${finW * 0.75} 0, ${finW} ${radius * 0.3}, ${finW} ${radius}
          V ${height - radius}
          A ${radius} ${radius} 0 0 0 ${finW + radius} ${height}
          H ${width - radius}
          A ${radius} ${radius} 0 0 0 ${width} ${height - radius}
          V ${radius}
          A ${radius} ${radius} 0 0 0 ${width - radius} 0
          Z
        `;
      } else {
        path = `
          M 0 ${radius}
          A ${radius} ${radius} 0 0 0 ${radius} ${height}
          H ${width - finW - radius}
          A ${radius} ${radius} 0 0 0 ${width - finW} ${height - radius}
          V ${radius}
          C ${width - finW} ${radius * 0.3}, ${width - finW * 0.75} 0, ${width} 0
          H ${radius}
          A ${radius} ${radius} 0 0 0 0 ${radius}
          Z
        `;
      }

      return `
        <svg class="bubble-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
          <path d="${path}" fill="${color}" stroke="none" />
        </svg>
      `;
    }

    // Render Chat Messages
    function renderChatMessages() {
      const chat = appData.chats.find(c => c.id === appData.activeChatId);
      if (!chat) return;

      document.getElementById('activeChatTitle').textContent = chat.title || 'Chat Name';
      const container = document.getElementById('messagesContainer');
      container.innerHTML = '';

      chat.messages.forEach(msg => {
        const row = document.createElement('div');
        row.className = `w-full flex ${msg.side === 'green' ? 'justify-start' : 'justify-end'}`;

        const wrapper = document.createElement('div');
        wrapper.className = 'bubble-wrapper';

        const content = document.createElement('div');
        content.className = 'bubble-content';
        // Asymmetric horizontal padding so text centers relative to capsule body
        if (msg.side === 'green') {
          content.style.padding = '14px 18px 14px 28px';
        } else {
          content.style.padding = '14px 28px 14px 18px';
        }
        content.textContent = msg.text;

        wrapper.appendChild(content);
        row.appendChild(wrapper);
        container.appendChild(row);

        // Calculate exact dimensions for crisp vector rendering
        const updateBubble = () => {
          const w = Math.round(wrapper.offsetWidth);
          const h = Math.round(wrapper.offsetHeight);
          if (w > 0 && h > 0) {
            const oldSvg = wrapper.querySelector('svg');
            if (oldSvg) oldSvg.remove();
            wrapper.insertAdjacentHTML('afterbegin', createBubbleSVG(msg.side, w, h));
          }
        };

        requestAnimationFrame(updateBubble);
      });

      // Scroll to bottom
      setTimeout(() => {
        container.scrollTop = container.scrollHeight;
      }, 50);
    }

    // Toggle green / blue mode
    const modeToggle = document.getElementById('modeToggleSwitch');
    const toggleKnob = document.getElementById('toggleKnob');
    const modeStatusLabel = document.getElementById('modeStatusLabel');
    const perspectiveHint = document.getElementById('perspectiveHint');

    function setMode(mode) {
      appData.currentMode = mode;
      if (mode === 'blue') {
        modeToggle.style.backgroundColor = '#009abb';
        toggleKnob.style.transform = 'translateX(24px)';
        modeStatusLabel.textContent = 'Blue Mode';
        modeStatusLabel.className = 'text-xs font-semibold text-[#009abb] uppercase tracking-wide';
        perspectiveHint.textContent = 'Right / Voice 2';
      } else {
        modeToggle.style.backgroundColor = '#00bf57';
        toggleKnob.style.transform = 'translateX(0px)';
        modeStatusLabel.textContent = 'Green Mode';
        modeStatusLabel.className = 'text-xs font-semibold text-[#00bf57] uppercase tracking-wide';
        perspectiveHint.textContent = 'Left / Voice 1';
      }
    }

    modeToggle.addEventListener('click', () => {
      setMode(appData.currentMode === 'green' ? 'blue' : 'green');
    });

    // Send Message
    const chatForm = document.getElementById('chatForm');
    const messageInput = document.getElementById('messageInput');

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (!text || !appData.activeChatId) return;

      const chat = appData.chats.find(c => c.id === appData.activeChatId);
      if (!chat) return;

      chat.messages.push({
        id: 'msg_' + Date.now(),
        side: appData.currentMode,
        text: text,
        timestamp: Date.now()
      });
      chat.updatedAt = Date.now();

      // If still named "Chat Name", auto-name it from the first line
      if (chat.title === 'Chat Name' && chat.messages.length === 1) {
        chat.title = text.length > 24 ? text.substring(0, 24) + '...' : text;
      }

      saveData();
      messageInput.value = '';
      renderChatMessages();
    });

    // Navigation and Action Handlers
    document.getElementById('btnBackToHome').addEventListener('click', () => {
      switchView('home');
    });

    document.getElementById('btnNewReflection').addEventListener('click', () => {
      const newChat = {
        id: 'chat_' + Date.now(),
        title: 'New Reflection',
        updatedAt: Date.now(),
        messages: []
      };
      appData.chats.unshift(newChat);
      appData.activeChatId = newChat.id;
      saveData();
      switchView('chat');
    });

    // Search input
    document.getElementById('searchInput').addEventListener('input', (e) => {
      renderHomeList(e.target.value);
    });

    // Modal / Action Sheet
    const actionModal = document.getElementById('actionSheetModal');

    function openActionSheet(chatId) {
      targetActionChatId = chatId;
      const chat = appData.chats.find(c => c.id === chatId);
      document.getElementById('modalChatTitle').textContent = chat ? chat.title : 'Options';
      actionModal.classList.remove('hidden');
    }

    function closeActionSheet() {
      actionModal.classList.add('hidden');
      targetActionChatId = null;
    }

    document.getElementById('btnChatMenu').addEventListener('click', () => {
      if (appData.activeChatId) openActionSheet(appData.activeChatId);
    });

    document.getElementById('chatHeaderTitle').addEventListener('click', () => {
      if (appData.activeChatId) renameChat(appData.activeChatId);
    });

    document.getElementById('modalBtnCancel').addEventListener('click', closeActionSheet);
    actionModal.addEventListener('click', (e) => {
      if (e.target === actionModal) closeActionSheet();
    });

    document.getElementById('modalBtnRename').addEventListener('click', () => {
      const id = targetActionChatId;
      closeActionSheet();
      if (id) renameChat(id);
    });

    function renameChat(id) {
      const chat = appData.chats.find(c => c.id === id);
      if (!chat) return;
      const newTitle = prompt('Rename this reflection:', chat.title);
      if (newTitle && newTitle.trim()) {
        chat.title = newTitle.trim();
        saveData();
        renderHomeList();
        if (appData.activeChatId === id) {
          document.getElementById('activeChatTitle').textContent = chat.title;
        }
      }
    }

    document.getElementById('modalBtnDelete').addEventListener('click', () => {
      const id = targetActionChatId;
      closeActionSheet();
      if (!id) return;
      if (confirm('Are you sure you want to delete this reflection?')) {
        appData.chats = appData.chats.filter(c => c.id !== id);
        saveData();
        if (appData.activeChatId === id) {
          switchView('home');
        } else {
          renderHomeList();
        }
      }
    });

    document.getElementById('modalBtnExport').addEventListener('click', () => {
      const id = targetActionChatId;
      closeActionSheet();
      if (!id) return;
      const chat = appData.chats.find(c => c.id === id);
      if (!chat) return;

      const md = `# ${chat.title}\n*Exported on ${new Date().toLocaleDateString()}*\n\n` +
        chat.messages.map(m => `**[${m.side.toUpperCase()}]**: ${m.text}`).join('\n\n');

      navigator.clipboard.writeText(md).then(() => {
        alert('Copied reflection to clipboard!');
      }).catch(() => {
        prompt('Copy your reflection:', md);
      });
    });

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }

    // Initialize App
    loadData();
    renderHomeList();
    setMode('green');
  </script>
</body>
</html>
